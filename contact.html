<!DOCTYPE html>
<html>
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #222;
  padding-top: 5px;
}



/* glow biru + merah */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;

  background:
    radial-gradient(circle at 20% 25%, rgba(0, 140, 255, 0.22), transparent 45%),
    radial-gradient(circle at 80% 70%, rgba(255, 0, 60, 0.20), transparent 50%);

  z-index: 0;
}

.contact-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:80vh;
}

.contact-card{

    position:relative;

    width:600px;
    max-width:90%;

    padding:45px;

    background:
        linear-gradient(
            180deg,
            rgba(8,20,33,.95),
            rgba(14,35,55,.95)
        );

    border:2px solid #28D9FF;

    border-radius:20px;

    box-shadow:
        0 0 10px rgba(40,217,255,.45),
        0 0 30px rgba(40,217,255,.2),
        inset 0 0 20px rgba(40,217,255,.08);

    text-align:center;

    overflow:hidden;

    animation: floatCard 4s ease-in-out infinite;
}

.contact-card .bolt{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background:radial-gradient(circle,#f5f5f5,#7a7a7a);
    border:1px solid #555;
}

.contact-card::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        repeating-linear-gradient(
            180deg,
            rgba(255,255,255,.03) 0px,
            rgba(255,255,255,.03) 2px,
            transparent 2px,
            transparent 5px
        );

    pointer-events:none;
}

.contact-card::before{

    content:"";

    position:absolute;

    width:260px;
    height:260px;

    background:radial-gradient(
        circle,
        rgba(64,33,138,.35),
        rgba(30,47,216,.18),
        transparent 70%
    );

    filter:blur(60px);

    top:-80px;
    left:-80px;

    border-radius:50%;

    z-index:-1;
}

.contact-card h1{

    font-family:'Orbitron',sans-serif;

    font-size:36px;

    color:#28D9FF;

    letter-spacing:2px;

    text-transform:uppercase;

    text-shadow:
        0 0 8px rgba(40,217,255,.5);

    margin-bottom:30px;
}

.contact-card p{

    color:#E8F9FF;

    font-size:20px;

    line-height:1.8;
}

.contact-card a{

    color:#28D9FF;

    text-decoration:none;

    font-weight:700;

    transition:.3s;
}

.contact-card a:hover{

    color:white;

    text-shadow:
        0 0 10px #28D9FF;
}

@keyframes floatCard{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-12px);
    }

}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
    radial-gradient(circle at 15% 20%, rgba(80,180,255,.25), transparent 30%),
    radial-gradient(circle at 90% 80%, rgba(255,255,255,.08), transparent 25%);
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.08;

    background:
    repeating-linear-gradient(
        -45deg,
        transparent 0px,
        transparent 40px,
        rgba(255,255,255,.5) 41px,
        transparent 42px
    );
}

/* ========================= */
/* BACK BUTTON */
/* ========================= */

.back-wrapper{
    max-width:1200px;
    margin:50px auto 0;
    padding:0 20px;
}

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;

    padding:12px 22px;

    background:#0F2036;

    color:#27D9FF;

    text-decoration:none;

    border:2px solid #27D9FF;

    border-radius:10px;

    font-size:16px;

    font-weight:600;

    transition:.3s;

    box-shadow:
        0 0 12px rgba(39,217,255,.25);
}

.back-btn:hover{

    background:#27D9FF;

    color:#081521;

    transform:translateX(-4px);

    box-shadow:
        0 0 18px rgba(39,217,255,.45);

}

@media (max-width:768px){

    .contact-container{

        padding:20px;

    }

    .contact-card{

        width:100%;
        max-width:100%;
        padding:45px 35px;

    }

    .contact-card h1{

        font-size:28px;

    }

    .contact-card p{

        font-size:18px;

    }

}
  
</style>


</head>
<body>

<div class="back-wrapper">
    <a href="index.html" class="back-btn">
        ←
    </a>
</div>

<div class="contact-container">

    <div class="contact-card">

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

        <h1>Contact Us</h1>

        <p>📍 Ruko Cikupa Niaga Mas, Tangerang (Head Office)</p>

        <p>📞 +62 895-0726-6465</p>

        <p>
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"
         width="20"
         style="vertical-align:middle;">
        <a href="https://instagram.com/nexio_ofc" target="_blank">
        @nexio_ofc
        </a>
        </p>

    </div>

</div>

</body>
</html>
